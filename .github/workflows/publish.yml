name: Build and publish buildpacks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**/v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check scripts and buildpack metadata
        run: |
          bash -n pnpm-assets/bin/detect pnpm-assets/bin/build node-app/bin/detect node-app/bin/build
          python3 tests/check.py
          python3 tests/node-app.py

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          component=${RELEASE_TAG%%/*}
          tag_version=${RELEASE_TAG#*/}
          case "$component" in
            pnpm-assets|go-web|node-app) ;;
            *) echo "Unknown buildpack: $component" >&2; exit 1 ;;
          esac
          version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["buildpack"]["version"])' "$component/buildpack.toml")
          if [ "$tag_version" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match $component version $version" >&2
            exit 1
          fi
          printf 'component=%s\nversion=%s\n' "$component" "$version" >> "$GITHUB_OUTPUT"
      - name: Install pack
        uses: buildpacks/github-actions/setup-pack@8fe5c9d7f5a3fa22d4b7cc7d50ba8ebd7eddf414 # v5.12.5
        with:
          pack-version: '0.40.10'
      - name: Log in to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Package and publish buildpack
        env:
          COMPONENT: ${{ steps.release.outputs.component }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          pack buildpack package "$registry/$COMPONENT:$VERSION" \
            --config "$COMPONENT/package.toml" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --publish
          printf '%s\n' "Published \`$registry/$COMPONENT:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
